<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harmony Horizon — Apps</title>
<meta name="description" content="Harmony Horizon のアプリ一覧">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --ink:        #16233A;
  --paper:      #F5F5F1;
  --gold:       #B4893C;
  --gold-text:  #8A6516;
  --muted:      #6E7269;
  --faint:      #8A8F86;
  --line:       #D8D8D0;

  --mincho: 'Zen Old Mincho', serif;
  --gothic: 'Zen Kaku Gothic New', sans-serif;
  --mono:   'JetBrains Mono', monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--gothic);
  font-size: 16px;
  line-height: 2;
}

main {
  max-width: 620px;
  margin: 0 auto;
  padding: 96px 24px 80px;
}

.eyebrow {
  font-family: var(--mono);
  font-size: 0.72rem;
  font-weight: 500;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--gold-text);
}

.eyebrow::after {
  content: "";
  display: block;
  width: 26px;
  height: 2px;
  background: var(--gold);
  margin-top: 10px;
}

h1 {
  font-family: var(--mincho);
  font-weight: 700;
  font-size: 1.7rem;
  line-height: 1.7;
  letter-spacing: 0.04em;
  margin-top: 20px;
}

.apps { margin-top: 56px; border-bottom: 1px solid var(--line); }

.app-link {
  display: block;
  text-decoration: none;
  color: inherit;
  border-top: 1px solid var(--line);
  padding: 26px 2px;
}

.app-link .label {
  font-family: var(--mono);
  font-size: 0.76rem;
  font-weight: 500;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--gold-text);
}

.app-link h2 {
  font-family: var(--mincho);
  font-weight: 700;
  font-size: 1.2rem;
  line-height: 1.7;
  letter-spacing: 0.04em;
  margin-top: 4px;
}

.app-link p {
  color: var(--muted);
  font-size: 0.95rem;
  margin-top: 6px;
}

.app-link .go {
  font-family: var(--mono);
  font-size: 0.78rem;
  letter-spacing: 0.1em;
  color: var(--gold-text);
  margin-top: 14px;
  display: inline-block;
}

.app-link:hover h2, .app-link:focus-visible h2 { color: var(--gold-text); }

.app-link:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 3px;
}

footer {
  padding: 0 24px 64px;
  text-align: center;
}

footer p {
  font-family: var(--mono);
  font-size: 0.68rem;
  letter-spacing: 0.28em;
  color: var(--faint);
}
</style>
</head>
<body>

<main>
  <p class="eyebrow">Harmony Horizon</p>
  <h1>Apps</h1>

  <div class="apps">
    <a class="app-link" href="immigration/">
      <p class="label">Essential Immigration</p>
      <h2>入国審査の準備</h2>
      <p>入国審査で聞かれることを知り、出発前の準備を確認する</p>
      <span class="go">immigration →</span>
    </a>
  </div>
</main>

<footer>
  <p>HARMONY HORIZON</p>
</footer>

</body>
</html>
