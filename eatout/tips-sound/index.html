<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>音を聞いてみる — コツのメール用</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/assets/site/fonts.css">
<style>
/* ══════════════════════════════════════════════════════════════
   /eatout/tips-sound  2026-10-07
   聞き取りクイズ登録後の「コツのメール」3通から来るページ。
   各メールが「まず、音を聞いてみてください」と言うので、その音だけを
   置く。英語の文字は出さない(耳から、声へ。音が先、文字は後)。

   部品は eatout/quiz の完成品をそのまま写した(DESIGN-013):
     .speaker(金の丸い音ボタン・ring の動き) … eatout/quiz 114〜123行
     .hint / .toggles / .toggle(声・速さ)  … eatout/quiz 132〜141行
     playClip(音の鳴らし方)                  … eatout/quiz 699〜735行
   iOSの受話口対策は ../audio-fix.js。
   書体は www の決まり(ヒラギノを含む端末標準、DESIGN-006)。
   音声は 飲食店コース本体と同じ ElevenLabs の女性・男性の声。
   ══════════════════════════════════════════════════════════════ */
:root{
  --navy-deep:#1D1610; --cream:#FAF3E6; --gold-bright:#E2A33D;
  --hold:#8C651F; --ink:#221E19; --ink-soft:#4A443B;
  --line:rgba(43,32,24,0.13); --shadow-card:0 30px 70px -24px rgba(29,22,16,0.22);
  --font:-apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:#FBF9F6;color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.9;-webkit-font-smoothing:antialiased;min-height:100svh}
main{max-width:520px;margin:0 auto;padding:max(24px,env(safe-area-inset-top)) 22px calc(48px + env(safe-area-inset-bottom))}
h1{font-size:24px;font-weight:700;line-height:1.5;margin:8px 0 24px}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow-card);padding:24px 20px 26px;margin-bottom:20px;scroll-margin-top:16px;text-align:center}
.card:target{border-color:var(--gold-bright);box-shadow:0 0 0 3px rgba(226,163,61,0.3),var(--shadow-card)}
.num{display:block;font-size:16px;font-weight:700;color:var(--hold)}
.scene{color:var(--ink-soft)}
/* eatout/quiz .speaker(そのまま) */
.speaker{width:104px;height:104px;border-radius:50%;border:none;cursor:pointer;
  background:var(--gold-bright);display:flex;align-items:center;justify-content:center;
  margin:20px auto 0;box-shadow:0 16px 34px -12px rgba(29,22,16,.5);
  transition:transform .1s ease;-webkit-tap-highlight-color:transparent}
.speaker:active{transform:scale(.95)}
.speaker svg{width:40px;height:40px}
.speaker.playing{animation:ring 1.1s ease-out infinite}
@keyframes ring{0%{box-shadow:0 16px 34px -12px rgba(29,22,16,.5),0 0 0 0 rgba(226,163,61,.5)}
  100%{box-shadow:0 16px 34px -12px rgba(29,22,16,.5),0 0 0 20px rgba(226,163,61,0)}}
@media (prefers-reduced-motion:reduce){.speaker.playing{animation:none}}
/* eatout/quiz の .hint と .toggles/.toggle(声・速さ)。1文字も変えずに写した */
.hint{margin-top:14px;font-size:1rem;font-weight:700;color:var(--ink-soft);text-align:center}
.toggles{display:flex;flex-direction:column;gap:10px;margin:18px 0 0}
.toggle{display:flex;border:1px solid var(--line);border-radius:999px;
  overflow:hidden;background:#FFFFFF}
.toggle button{flex:1;border:none;background:transparent;padding:12px 8px;
  font-family:var(--font);font-size:1rem;font-weight:700;color:var(--ink-soft);
  cursor:pointer;transition:background .15s ease,color .15s ease;
  -webkit-tap-highlight-color:transparent}
.toggle button.on{background:var(--navy-deep);color:var(--cream);border-radius:999px}
.solo-link{display:none}
/* メールの #1 #2 #3 から来た時は、その通の音だけを出す(押す回数を減らす) */
body:has(.card:target) .card:not(:target){display:none}
body:has(.card:target) .solo-link{display:block}
.foot{margin-top:32px;font-size:16px;color:var(--ink-soft)}
.foot a,.solo-link a{color:var(--hold);font-weight:700;display:inline-block;min-height:44px;line-height:44px}
.nw{white-space:nowrap}
.foot-tag{margin-top:32px;font-family:"Lora", Georgia, serif;font-style:italic;font-weight:400;font-size:18px;color:#8F6524;margin-bottom:4px} /* 全ページ共通(2026-09-29 HARU決定)。変えない */
.kaeru{font-size:17px}
</style>
</head>
<body>
<main>
  <h1>音を聞いてみる</h1>


  <section class="card" id="1">
    <span class="num">1通目の音</span>
    <p class="scene">カフェで、飲み物を頼んだあと。</p>
      <button class="speaker" type="button" data-base="audio/q_size_05_" aria-label="音を聞く">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--navy-deep)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polygon points="4 8 8 8 12 4 12 20 8 16 4 16" fill="var(--navy-deep)" stroke="none"/>
          <path d="M16 8a5 5 0 0 1 0 8"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/>
        </svg>
      </button>
    <p class="hint">🎧 タップして音声を聞く</p>

    <div class="toggles" role="group" aria-label="声と速度の設定">
      <div class="toggle">
        <button type="button" class="on" data-voice="f">女性の声</button>
        <button type="button" data-voice="m">男性の声</button>
      </div>
      <div class="toggle">
        <button type="button" class="on" data-rate="1">ふつう 1.0x</button>
        <button type="button" data-rate="0.7">ゆっくり 0.7x</button>
      </div>
    </div>
  </section>

  <section class="card" id="2">
    <span class="num">2通目の音</span>
    <p class="scene">お会計のあと。</p>
      <button class="speaker" type="button" data-base="audio/q_pay_06_" aria-label="音を聞く">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--navy-deep)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polygon points="4 8 8 8 12 4 12 20 8 16 4 16" fill="var(--navy-deep)" stroke="none"/>
          <path d="M16 8a5 5 0 0 1 0 8"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/>
        </svg>
      </button>
    <p class="hint">🎧 タップして音声を聞く</p>

    <div class="toggles" role="group" aria-label="声と速度の設定">
      <div class="toggle">
        <button type="button" class="on" data-voice="f">女性の声</button>
        <button type="button" data-voice="m">男性の声</button>
      </div>
      <div class="toggle">
        <button type="button" class="on" data-rate="1">ふつう 1.0x</button>
        <button type="button" data-rate="0.7">ゆっくり 0.7x</button>
      </div>
    </div>
  </section>

  <section class="card" id="3">
    <span class="num">3通目の音</span>
    <p class="scene">カフェで、注文したあと。</p>
      <button class="speaker" type="button" data-base="audio/q_size_02_" aria-label="音を聞く">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--navy-deep)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polygon points="4 8 8 8 12 4 12 20 8 16 4 16" fill="var(--navy-deep)" stroke="none"/>
          <path d="M16 8a5 5 0 0 1 0 8"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/>
        </svg>
      </button>
    <p class="hint">🎧 タップして音声を聞く</p>

    <div class="toggles" role="group" aria-label="声と速度の設定">
      <div class="toggle">
        <button type="button" class="on" data-voice="f">女性の声</button>
        <button type="button" data-voice="m">男性の声</button>
      </div>
      <div class="toggle">
        <button type="button" class="on" data-rate="1">ふつう 1.0x</button>
        <button type="button" data-rate="0.7">ゆっくり 0.7x</button>
      </div>
    </div>
  </section>

  <p class="foot solo-link"><a href="./">ほかの音も聞く</a></p>
  <p class="foot-tag">Train your ears. Find your voice.</p>
  <p class="kaeru">耳から、声へ。</p>
</main>

<!-- iPhoneで音が受話口から出るのを防ぐ。詳しくは ../audio-fix.js の先頭。 -->
<script src="../audio-fix.js"></script>
<script>
'use strict';
/* eatout/quiz の playClip を、そのまま写した。呼ばれるたびに新しい
   HTMLAudioを作る。「ゆっくり」は playbackRate ではなく _slow.mp3。 */
var cur = null;
function playClip(src, btn) {
  if (!src) return;
  try { if (cur) { cur.pause(); cur.currentTime = 0; } } catch (e) {}
  var a = new Audio(src);
  cur = a;
  var all = document.querySelectorAll('.playing');
  for (var i = 0; i < all.length; i++) all[i].classList.remove('playing');
  if (btn) {
    btn.classList.add('playing');
    var off = function () { btn.classList.remove('playing'); };
    a.addEventListener('ended', off);
    a.addEventListener('error', off);
  }
  if (window.eatoutPlay) {
    window.eatoutPlay(a, {
      isCurrent: function () { return cur === a; },
      onFail: function () { if (btn) btn.classList.remove('playing'); }
    });
    return;
  }
  var p = a.play();
  if (p && typeof p['catch'] === 'function') {
    p['catch'](function () { if (btn) btn.classList.remove('playing'); });
  }
}
var voice = 'f', rate = 1;
function srcFor(card) {
  var sp = card.querySelector('.speaker');
  return sp.getAttribute('data-base') + voice + (rate === 1 ? '' : '_slow') + '.mp3';
}
/* eatout/quiz と同じ動き: 押すと、その問の音を今の声・速さで鳴らす */
var cards = document.querySelectorAll('.card');
for (var i = 0; i < cards.length; i++) {
  (function (card) {
    var sp = card.querySelector('.speaker');
    sp.addEventListener('click', function () { playClip(srcFor(card), sp); });
    card.querySelectorAll('[data-voice]').forEach(function (b) {
      b.addEventListener('click', function () {
        voice = b.getAttribute('data-voice');
        document.querySelectorAll('[data-voice]').forEach(function (o) { o.classList.toggle('on', o.getAttribute('data-voice') === voice); });
        playClip(srcFor(card), sp);
      });
    });
    card.querySelectorAll('[data-rate]').forEach(function (b) {
      b.addEventListener('click', function () {
        rate = parseFloat(b.getAttribute('data-rate'));
        document.querySelectorAll('[data-rate]').forEach(function (o) { o.classList.toggle('on', parseFloat(o.getAttribute('data-rate')) === rate); });
        playClip(srcFor(card), sp);
      });
    });
  })(cards[i]);
}
</script>
</body>
</html>
